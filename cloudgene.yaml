id: dummy-cloudgene-app
name: Dummy Cloudgene App
description: Dummy app for testing purposes.
version: 0.1.0
website: https://github.com/MarcFraile/dummy-cloudgene-app
category: Application
submitButton: Run

workflow:
  steps:
    - name: Hello from the Nextflow
      type: nextflow
      script: main.nf
      groups:
        - id: main
          label: Main
      processes:
        - process: "nextflowStep"
          view: label
          group: main

  inputs:
    - id: info-box
      type: info
      description: This is rendered HTML <a href="https://youtu.be/dQw4w9WgXcQ?si=DrgPl-zVe2byLMdv" target="_blank">click me!</a>
    - id: text-input
      type: string
      description: Important text
      help: https://youtu.be/dQw4w9WgXcQ?si=DrgPl-zVe2byLMdv
      required: true
      details: This is a longer explanation. Hello, world!
    - id: hr
      type: separator
    - id: a-label
      type: label
      description: I am a label! Lorem ipsum dolor sit amet, consectetur adipiscing elit.
    - id: boss-list
      type: list
      description: Choose your team
      values:
        team-a: Team A!
        team-b: Team... B?
    - id: team-options
      type: binded-list
      description: Team options
      emptySelection: get yer options
      value: boss-list
      groups:
        team-a:
          label: Team A Options
          values:
            apple: Apple
            advice: Advice
            aardvark: Aardvark
        team-b:
          label: Team B Options
          values:
            bees: Bees
            bonnets: Bonnets
            barracudas: Barracudas
            balloons: Balloons

